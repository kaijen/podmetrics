name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die Untergrenze aus pyproject.toml, 3.14 die aktuelle
        # Fassung. Was dazwischen liegt, wird mitgeprüft, damit eine Lücke
        # nicht erst beim Nutzer auffällt.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # soundfile braucht libsndfile; auf ubuntu-latest ist es nicht gesetzt.
      - name: libsndfile
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Installieren
        run: uv pip install --system -e ".[cli]" pytest ruff mypy

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check src tests scripts

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest
